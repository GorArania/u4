<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Ultima IV (xu4)</title>
  <link rel="stylesheet" href="xu4.css?v=12" />
</head>
<body>
  <!-- Anmeldung -->
  <section id="auth" class="screen">
    <div class="auth-box">
      <h1>Ultima IV</h1>
      <p class="subtitle">Quest of the Avatar</p>
      <form id="auth-form">
        <label for="username">Benutzername</label>
        <input id="username" name="username" autocomplete="username" required
               minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+" />
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required minlength="6" />
        <p id="auth-error" class="error" hidden></p>
        <div class="buttons">
          <button type="submit" data-action="login">Anmelden</button>
          <button type="submit" data-action="register" class="secondary">Registrieren</button>
        </div>
      </form>
    </div>
  </section>

  <!-- Spiel -->
  <section id="app" class="screen" hidden>
    <header id="topbar">
      <span id="player-name"></span>
      <span id="save-info"></span>
      <span class="spacer"></span>
      <a id="map-editor-link" href="/Ultima4/public/map-editor.html" target="_blank" rel="noopener">🗺️ Karten-Editor</a>
      <span class="spacer"></span>
      <button id="save-btn" title="Spielstand auf Server speichern">💾 Speichern</button>
      <button id="logout-btn" class="secondary">Abmelden</button>
    </header>

    <div id="screen-wrap">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
      <div id="loading">Lade Ultima IV …</div>
    </div>

    <div id="controls">
      <div id="keyboard"></div>
      <div id="dpad">
        <button class="dir" data-key="up"    aria-label="Norden">▲</button>
        <button class="dir" data-key="left"  aria-label="Westen">◄</button>
        <button class="dir" data-key="enter" aria-label="Enter">↵</button>
        <button class="dir" data-key="right" aria-label="Osten">►</button>
        <button class="dir" data-key="down"  aria-label="Süden">▼</button>
      </div>
      <!-- Vollbild: bleibt verborgen, bis xu4-ui.js die Fullscreen-API gefunden hat -->
      <button id="fullscreen-btn" type="button" aria-label="Vollbild" title="Vollbild" hidden>
        <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M15 20v-5h5M9 20v-5H4"/></svg>
      </button>
    </div>
  </section>

  <script src="xu4-ui.js?v=11"></script>
</body>
</html>
