# Apache-Konfiguration für xu4-web (Ultima IV im Browser, WebAssembly).
#
# Liefert das statische Spiel + die PHP-API (Anmeldung, Spielstände) unter
# https://<server>/ultima4/ aus.
#
# Installation auf dem Server:
#   sudo cp xu4-web/apache-ultima4.conf /etc/apache2/conf-available/ultima4.conf
#   sudo a2enmod rewrite
#   sudo a2enconf ultima4
#   sudo systemctl reload apache2
#   sudo chown -R www-data: /var/www/html/Ultima4/xu4-web/web
#
# Pfad ggf. anpassen, falls das Repo woanders liegt.

Alias /ultima4 /var/www/html/Ultima4/xu4-web/web

<Directory /var/www/html/Ultima4/xu4-web/web>
    Require all granted
    AllowOverride All
    DirectoryIndex index.html

    # WASM mit korrektem MIME-Typ ausliefern
    AddType application/wasm .wasm

    # Datenbank/Spielstände nicht ausliefern
    <FilesMatch "\.(sqlite|sqlite-wal|sqlite-shm)$">
        Require all denied
    </FilesMatch>
</Directory>

# Datenverzeichnis (SQLite) komplett sperren
<Directory /var/www/html/Ultima4/xu4-web/web/data>
    Require all denied
</Directory>
