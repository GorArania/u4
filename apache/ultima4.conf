# Apache-Konfiguration für Ultima IV im Browser (PHP-Backend)
#
# Installation auf dem Server:
#   sudo cp apache/ultima4.conf /etc/apache2/conf-available/ultima4.conf
#   (Pfad in der Alias-/Directory-Zeile ggf. anpassen)
#   sudo a2enmod rewrite
#   sudo a2enconf ultima4
#   sudo systemctl reload apache2
#
# Danach läuft das Spiel unter  http://<server>/ultima4/

# Nur der public/-Ordner wird ausgeliefert; api/-URLs verarbeitet api.php.
Alias /ultima4 /var/www/html/Ultima4/public

<Directory /var/www/html/Ultima4/public>
    Require all granted
    AllowOverride All
    DirectoryIndex index.html
</Directory>

# Wichtig: Das Projekt liegt innerhalb des DocumentRoot (/var/www/html).
# Ohne diese Sperre wären Datenbank (data/), Spieldateien und Quellcode
# direkt über http://<server>/Ultima4/... herunterladbar.
<Directory /var/www/html/Ultima4>
    Require all denied
</Directory>
